<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Aisant Companion</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        padding: 2rem;
        display: grid;
        gap: 2rem;
        background: radial-gradient(circle at top, #f3f4ff, #cdd6f4);
        min-height: 100vh;
      }

      header {
        text-align: center;
      }

      main {
        display: grid;
        gap: 1.5rem;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }

      .card {
        background: rgba(255, 255, 255, 0.75);
        border-radius: 18px;
        padding: 1.5rem;
        box-shadow: 0 10px 35px rgba(79, 70, 229, 0.15);
        backdrop-filter: blur(16px);
      }

      .emotion-face {
        font-size: 4rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
      }

      textarea {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(79, 70, 229, 0.2);
        padding: 1rem;
        resize: vertical;
        min-height: 160px;
        font-size: 1rem;
      }

      select,
      button {
        border-radius: 999px;
        border: none;
        padding: 0.75rem 1.25rem;
        font-size: 1rem;
        cursor: pointer;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        font-weight: 600;
      }

      button.secondary {
        background: rgba(79, 70, 229, 0.1);
        color: #4338ca;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }

      .history-entry {
        background: rgba(99, 102, 241, 0.1);
        border-radius: 12px;
        padding: 0.75rem 1rem;
      }

      .history-entry strong {
        display: inline-block;
        margin-bottom: 0.5rem;
      }

      .chat-log {
        max-height: 220px;
        overflow-y: auto;
        display: grid;
        gap: 0.75rem;
      }

      .chat-bubble {
        padding: 0.75rem 1rem;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.08);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>AI Aisant — Emotional Companion</h1>
      <p>
        Prototype journaling space blending emotion-aware visuals, retrieval augmented
        insights, and integrations roadmap.
      </p>
    </header>
    <main>
      <section class="card" id="emotion-card">
        <div class="emotion-face" id="emotion-face" aria-live="polite">😀</div>
        <label for="emotion-select">Current emotion</label>
        <select id="emotion-select"></select>
      </section>

      <section class="card">
        <h2>Journal</h2>
        <textarea id="journal-input" placeholder="How are you feeling today?"></textarea>
        <div style="display: flex; gap: 0.75rem; margin-top: 1rem">
          <button id="save-entry">Save Entry</button>
          <button class="secondary" id="summarize">Summarize History</button>
        </div>
      </section>

      <section class="card">
        <h2>History &amp; RAG</h2>
        <ul id="history"></ul>
      </section>

      <section class="card">
        <h2>Companion Chat</h2>
        <div class="chat-log" id="chat-log"></div>
        <textarea
          id="chat-input"
          placeholder="Ask for a reflection prompt or gratitude exercise"
          style="margin-top: 1rem"
        ></textarea>
        <div style="display: flex; justify-content: flex-end; margin-top: 0.75rem">
          <button id="send-chat">Send</button>
        </div>
      </section>
    </main>

    <template id="history-item-template">
      <li class="history-entry">
        <strong class="history-emotion"></strong>
        <p class="history-text"></p>
      </li>
    </template>

    <script>
      const emotionFaces = {
        joy: "😀",
        sadness: "😢",
        anger: "😠",
        fear: "😨",
        surprise: "😲",
        disgust: "🤢",
        calm: "😌",
        love: "😍",
      };

      const emotionSelect = document.getElementById("emotion-select");
      const emotionFace = document.getElementById("emotion-face");
      const historyList = document.getElementById("history");
      const journalInput = document.getElementById("journal-input");
      const chatLog = document.getElementById("chat-log");

      async function loadEmotions() {
        const response = await fetch("http://localhost:8000/emotions");
        const emotions = await response.json();
        emotions.forEach((emotion) => {
          const option = document.createElement("option");
          option.value = emotion;
          option.textContent = emotion.charAt(0).toUpperCase() + emotion.slice(1);
          emotionSelect.appendChild(option);
        });
        updateEmotionFace();
      }

      function updateEmotionFace() {
        const selected = emotionSelect.value || "joy";
        emotionFace.textContent = emotionFaces[selected] ?? "🙂";
      }

      async function refreshHistory() {
        const response = await fetch("http://localhost:8000/journal");
        const entries = await response.json();
        historyList.innerHTML = "";
        entries.slice().reverse().forEach((entry) => {
          const template = document.getElementById("history-item-template");
          const clone = template.content.cloneNode(true);
          clone.querySelector(".history-emotion").textContent =
            entry.emotion.charAt(0).toUpperCase() + entry.emotion.slice(1);
          clone.querySelector(".history-text").textContent = entry.content;
          historyList.appendChild(clone);
        });
      }

      async function saveJournalEntry() {
        const payload = {
          content: journalInput.value,
          emotion: emotionSelect.value || "joy",
          tags: [],
          attachments: [],
        };
        if (!payload.content.trim()) return;
        await fetch("http://localhost:8000/journal", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        journalInput.value = "";
        await refreshHistory();
      }

      async function summarizeHistory() {
        const response = await fetch("http://localhost:8000/history/summary");
        const data = await response.json();
        appendChatBubble("assistant", data.summary);
      }

      function appendChatBubble(role, message) {
        const bubble = document.createElement("div");
        bubble.className = "chat-bubble";
        bubble.textContent = `${role === "assistant" ? "Aisant" : "You"}: ${message}`;
        chatLog.appendChild(bubble);
        chatLog.scrollTop = chatLog.scrollHeight;
      }

      function sendChat() {
        const input = document.getElementById("chat-input");
        const message = input.value.trim();
        if (!message) return;
        appendChatBubble("user", message);
        appendChatBubble(
          "assistant",
          "This is a prototype response. The RAG pipeline will summarise journal context to craft reflective prompts."
        );
        input.value = "";
      }

      document.getElementById("save-entry").addEventListener("click", saveJournalEntry);
      document.getElementById("summarize").addEventListener("click", summarizeHistory);
      document.getElementById("send-chat").addEventListener("click", sendChat);
      emotionSelect.addEventListener("change", updateEmotionFace);

      loadEmotions();
      refreshHistory();
    </script>
  </body>
</html>
